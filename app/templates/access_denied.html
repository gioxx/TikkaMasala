<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access required · Tikka Masala</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2129; --muted: #5b6270; --card: #ffffff; --border: #dde1e7; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #14161a; --fg: #e6e8ec; --muted: #9aa1ad; --card: #1d2026; --border: #2c3038; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 32rem; margin: 1rem; padding: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
      h1 { margin: 0 0 0.75rem; font-size: 1.4rem; }
      p { margin: 0 0 0.75rem; }
      .meta { color: var(--muted); font-size: 0.85rem; margin: 1.25rem 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Access required</h1>
      <p>This Tikka Masala instance is protected by Cloudflare Access. Open it through its Cloudflare Access hostname and sign in there.</p>
      <p>If you already did, your Access session may have expired: reload the page to sign in again.</p>
      <p class="meta">Tikka Masala v{{ app_version }}</p>
    </main>
  </body>
</html>
