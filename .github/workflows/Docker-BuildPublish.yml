name: Docker Build/Publish Image

on:
  push:
    branches:
      - "main"
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+' # Match major.minor.patch (e.g., 0.6.1)
      - '[0-9]+\.[0-9]+'         # Match major.minor (e.g., 0.6)

# Runs for the same ref never overlap. On main a newer push cancels the run in progress,
# so `dev` always ends on the newest commit. Release tags each have their own ref and are
# never cancelled; `latest` is not set by push order but by version (see the last step).
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            gfsolone/${{ github.event.repository.name }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Login to DockerHub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      # Point `latest` at this release only if it is still the highest version once the
      # build is done. An older release finishing after a newer one leaves `latest` alone,
      # whatever order the runs started or finished in.
      - name: Promote to latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE: ${{ github.ref_name }}
          DOCKERHUB_IMAGE: gfsolone/${{ github.event.repository.name }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          git fetch --quiet --force --tags origin
          highest="$(git tag --list | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)"
          if [ "$highest" != "$RELEASE" ]; then
            echo "Release $RELEASE is not the highest version ($highest): latest left unchanged."
            exit 0
          fi
          for image in "${DOCKERHUB_IMAGE,,}" "${GHCR_IMAGE,,}"; do
            docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE"
          done

      - name: Update repo description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gfsolone/${{ github.event.repository.name }}
          short-description: ${{ github.event.repository.description }}
        if: github.ref != 'refs/heads/main'